name: Validate Node project

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing the project package.json
        required: false
        type: string
        default: .
      node-version-file:
        description: Repository-relative Node version file
        required: false
        type: string
        default: .node-version
      audit-command:
        description: Production dependency audit command
        required: false
        type: string
        default: npm audit --omit=dev --audit-level=high
      check-command:
        description: Validation command
        required: false
        type: string
        default: npm run check
      smoke-command:
        description: Optional browser smoke command
        required: false
        type: string
        default: ""
      artifact-name:
        description: Optional validated build artifact name
        required: false
        type: string
        default: ""
      artifact-path:
        description: Optional repository-relative artifact paths
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: npm ci
        working-directory: .
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

      - name: Audit production dependencies
        run: ${{ inputs.audit-command }}

      - name: Validate
        run: ${{ inputs.check-command }}

      - name: Run browser smoke and accessibility checks
        if: inputs.smoke-command != ''
        run: ${{ inputs.smoke-command }}

      - name: Upload validated build
        if: inputs.artifact-name != '' && inputs.artifact-path != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
